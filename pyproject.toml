[project]
name = "quest-engine-core"
version = "0.1.0"
description = "Quest Engine Backend Core Service"
authors = [
    { name = "syedtanzeelshaz", email = "syedtanzeelshaz@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy==2.0.54",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
]

[project.scripts]
dev = "app:main"
test = "pytest:main"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
