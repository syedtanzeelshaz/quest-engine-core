[project]
name = "quest-engine-core"
version = "0.1.0"
description = "Quest Engine Backend Core Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "syedtanzeelshaz", email = "syedtanzeelshaz@gmail.com" }]
dependencies = [
  "alembic>=1.13.1",
  "asyncpg>=0.31.0",
  "bcrypt>=4.0.0",
  "email-validator>=2.0.0",
  "fastapi>=0.110.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.6.4",
  "pydantic-settings>=2.2.1",
  "python-jose[cryptography]>=3.5.0",
  "sqlalchemy[asyncio]==2.0.54",
  "strawberry-graphql[fastapi]>=0.327.7",
  "uvicorn[standard]>=0.28.0",
]

[project.scripts]
dev = "app:main"
test = "pytest:main"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.1.1",
  "ruff>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
