[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used to generate new migration files: YYYYMMDDHHMMSS_slug.py
file_template = %%(year)d%%(month)02d%%(day)02d%%(hour)02d%%(minute)02d%%(second)02d_%%(slug)s

# Timezone syntax for autogenerated files (optional)
timezone = UTC

# Max length of characters to apply to the 'slug' field
truncate_slug_length = 50

# Set to 'true' to allow app-code to execute during 'revision' command
prepend_sys_path = .

# Connection URL (Overridden dynamically in env.py via settings.ALEMBIC_DATABASE_URL)
sqlalchemy.url =


[post_write_hooks]
# Optional: e.g., black formatting hook if you want automated code style formatting on generated migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 env.py versions/


# Logging configuration for Alembic CLI operations
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(asctime)s] [%(levelname)s] [%(name)s]: %(message)s
datefmt = %Y-%m-%d %H:%M:%S